spring.application.name=mv_services-backend
spring.config.import=optional:file:.env[.properties]
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
server.port=${PORT:${SERVER_PORT:8081}}

# Database Configuration (use env vars: DB_URL, DB_USERNAME, DB_PASSWORD)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mv_services_v1}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JWT (use env vars: JWT_SECRET, JWT_EXPIRATION_MS)
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# Flyway
spring.flyway.baseline-on-migrate=true
spring.flyway.repair-on-migrate=true

# JPA / Hibernate (schema managed by Flyway)
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Actuator health endpoint (Railway healthcheck)
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
